<div class="assistant" data-assistant data-chat-url="{% url 'assistant:chat' %}">
  <button
    type="button"
    class="assistant-launcher"
    data-assistant-toggle
    aria-expanded="false"
    aria-controls="assistant-panel"
  >
    <span class="assistant-launcher-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.8 4.5L18 9.3l-4.2 1.8L12 15.6l-1.8-4.5L6 9.3l4.2-1.8z"/>
        <path d="M5 16l.9 2.1L8 19l-2.1.9L5 22l-.9-2.1L2 19l2.1-.9z"/>
        <path d="M19 14l.7 1.8 1.8.7-1.8.7L19 19l-.7-1.8-1.8-.7 1.8-.7z"/>
      </svg>
    </span>
    <span class="assistant-launcher-label">Ask SmartMeds</span>
  </button>

  <section
    class="assistant-panel"
    id="assistant-panel"
    data-assistant-panel
    aria-label="SmartMeds assistant"
    hidden
  >
    <header class="assistant-header">
      <div class="assistant-identity">
        <span class="assistant-avatar" aria-hidden="true">AI</span>
        <div>
          <p class="assistant-kicker">SmartMeds</p>
          <h2 class="assistant-title">Health assistant</h2>
        </div>
      </div>
      <button type="button" class="assistant-close" data-assistant-close aria-label="Close assistant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </header>

    <div class="assistant-messages" data-assistant-messages role="log" aria-live="polite" aria-atomic="false">
      <div class="assistant-message assistant-message-bot">
        Hi {{ user.get_username }}. I can help you find prescriptions, explain how SmartMeds works,
        or look up the latest health news. What do you need?
      </div>
    </div>

    <div class="assistant-suggestions" data-assistant-suggestions>
      <button type="button" class="assistant-chip" data-assistant-prompt="What can this app do?">What can this app do?</button>
      <button type="button" class="assistant-chip" data-assistant-prompt="Show my prescriptions">Show my prescriptions</button>
      <button type="button" class="assistant-chip" data-assistant-prompt="Latest health news">Latest health news</button>
      <button type="button" class="assistant-chip" data-assistant-prompt="How do medicine reminders work?">How do reminders work?</button>
    </div>

    <form class="assistant-form" data-assistant-form>
      {% csrf_token %}
      <label class="sr-only" for="assistant-input">Ask the SmartMeds assistant</label>
      <textarea
        id="assistant-input"
        class="assistant-input"
        data-assistant-input
        rows="1"
        maxlength="2000"
        placeholder="Ask about medicines, app help, or health news…"
        autocomplete="off"
      ></textarea>
      <button type="submit" class="assistant-send" data-assistant-send aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4z"/>
        </svg>
      </button>
    </form>

    <p class="assistant-disclaimer">
      AI can make mistakes. Not medical advice. In an emergency call 108 or 112.
    </p>
  </section>
</div>
