{% extends "base.html" %}

{% block title %}Password updated · SmartMeds{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="card">
      <div class="card-body">
        <h1 class="auth-title">Password updated</h1>
        <p class="auth-subtitle">You can now log in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
