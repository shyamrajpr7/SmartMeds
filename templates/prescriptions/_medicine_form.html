<div class="medicine-row" data-medicine-row>
  {% for hidden in med_form.hidden_fields %}{{ hidden }}{% endfor %}
  <div class="medicine-row-head">
    <span class="medicine-row-title">Medicine</span>
    <button type="button" class="medicine-remove" data-remove-medicine>Remove</button>
  </div>
  <div class="medicine-grid">
    {% for field in med_form.visible_fields %}
      {% if field.name != "DELETE" %}
        <div class="field{% if field.name == 'instructions' %} field-full{% endif %}">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger">{{ error }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endfor %}
  </div>
  <span class="medicine-delete-input">{{ med_form.DELETE }}</span>
</div>
