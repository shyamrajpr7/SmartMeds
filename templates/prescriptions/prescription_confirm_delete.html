{% extends "base.html" %}

{% block title %}Delete prescription · SmartMeds{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="confirm-card">
    <div class="card card-danger">
      <div class="card-body">
        <h1 class="auth-title">Delete prescription?</h1>
        <p class="muted">
          This will permanently remove
          <strong>{{ object.doctor_name|default:"this prescription" }}</strong>
          and its medicines from your vault.
        </p>
        <form method="post" class="form-actions">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Delete</button>
          <a href="{% url 'prescriptions:detail' object.pk %}" class="btn btn-outline">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
