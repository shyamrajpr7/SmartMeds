{% extends "base.html" %}

{% block title %}Delete prescription · SmartMeds{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Delete prescription?</h1>
        <p class="text-muted">
          This will permanently remove
          <strong>{{ object.doctor_name|default:"this prescription" }}</strong>
          and its medicines from your vault.
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'prescriptions:detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
